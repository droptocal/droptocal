<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5CFF"/>
      <stop offset="0.55" stop-color="#3A6BFF"/>
      <stop offset="1" stop-color="#1FA2FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- the name and what it does -->
  <image href="icon.svg" x="64" y="98" width="96" height="96"/>
  <text x="180" y="170" font-family="Roboto" font-weight="700" font-size="64" fill="#fff">DropToCal</text>
  <text x="68" y="262" font-family="Roboto" font-weight="700" font-size="22" letter-spacing="3" fill="#fff" fill-opacity="0.9">AI CALENDAR IMPORT</text>
  <text x="66" y="312" font-family="Roboto" font-weight="500" font-size="31" fill="#fff">Posters, PDFs, links and text,</text>
  <text x="66" y="354" font-family="Roboto" font-weight="500" font-size="31" fill="#fff">straight into your calendar.</text>
  <text x="66" y="408" font-family="Roboto" font-size="21" fill="#fff" fill-opacity="0.85">Your AI, your key. No account, no tracking.</text>

  <!-- an event, as the app shows one -->
  <g filter="url(#shadow)">
    <rect x="600" y="96" width="364" height="308" rx="22" fill="#fff"/>
  </g>
  <text x="628" y="146" font-family="Roboto" font-weight="700" font-size="25" fill="#161a22">Jazz Night</text>
  <text x="628" y="182" font-family="Roboto" font-size="19" fill="#5b6475">Fri 16 Oct, 20:00</text>
  <text x="628" y="210" font-family="Roboto" font-size="19" fill="#5b6475">Moods, Zürich</text>
  <rect x="628" y="232" width="308" height="62" rx="10" fill="#f2f4f8"/>
  <text x="644" y="258" font-family="Roboto" font-style="italic" font-size="15" fill="#5b6475">read from</text>
  <text x="644" y="282" font-family="Roboto" font-style="italic" font-size="16" fill="#161a22">"Fr 16.10. — Beginn 20 Uhr"</text>
  <rect x="628" y="322" width="308" height="54" rx="12" fill="#2563eb"/>
  <text x="782" y="356" font-family="Roboto" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Add to calendar</text>
</svg>
