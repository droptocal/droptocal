name: Deploy free API (Cloudflare Worker)

# Deploys free/, the API the app asks when nobody has set up their own:
# Workers AI behind an OpenAI-compatible route at api.droptocal.org. It holds
# no key (Workers AI is a binding), so there is no secret beyond the deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/free/**'
      - '.github/workflows/deploy-free.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are present
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings -> Secrets and variables -> Actions -> Secrets." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/free

