# Security updates come from the repo setting (Settings → Code security), not from this file.
# Version updates: monthly, one PR per ecosystem. Majors are done by hand (apps-data STANDARD.md §9).
# app/android is generated by Capacitor; it moves with @capacitor/* (npx cap sync), not via Gradle updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
